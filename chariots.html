<style>
/* v67.42 — Mobile Voir la fiche popup (PC keeps normal page navigation) */
.mobile-fiche-popup{position:fixed;inset:0;z-index:10050;display:none;align-items:stretch;justify-content:center;background:rgba(8,20,36,.66);padding:0;overscroll-behavior:contain}
.mobile-fiche-popup.open{display:flex}
.mobile-fiche-dialog{display:flex;flex-direction:column;width:100%;height:100%;height:100dvh;min-height:0;background:#f4f8fc;overflow:hidden}
.mobile-fiche-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:0 0 52px;padding:0 12px;background:#fff;border-bottom:1px solid #dbe5ee;box-shadow:0 2px 8px rgba(12,35,58,.08)}
.mobile-fiche-title{min-width:0;color:#163a60;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mobile-fiche-close{flex:0 0 38px;width:38px;height:38px;border:0;border-radius:10px;background:#eaf1f7;color:#163a60;font-size:25px;line-height:1;display:grid;place-items:center;cursor:pointer}
.mobile-fiche-frame{display:block;flex:1 1 auto;width:100%;height:calc(100vh - 52px);height:calc(100dvh - 52px);min-height:0;border:0;background:#f4f8fc}
html.mobile-fiche-popup-lock,html.mobile-fiche-popup-lock body{overflow:hidden!important;overscroll-behavior:none}
@media(min-width:701px){.mobile-fiche-popup{display:none!important}}
</style>

<script>
/* Mobile-only popup for the actual chariot detail page. */
(function(){
  const list=document.getElementById('list');
  const modal=document.getElementById('mobileFichePopup');
  const frame=document.getElementById('mobileFicheFrame');
  const title=document.getElementById('mobileFicheTitle');
  const closeBtn=document.getElementById('mobileFicheClose');
  if(!list||!modal||!frame||!closeBtn||list.dataset.mobileFichePopupBound==='1')return;
  list.dataset.mobileFichePopupBound='1';
  let priorFocus=null;
  const isMobile=()=>window.matchMedia&&window.matchMedia('(max-width: 700px)').matches;
  function close(){
    modal.classList.remove('open');modal.setAttribute('aria-hidden','true');
    frame.src='about:blank';document.documentElement.classList.remove('mobile-fiche-popup-lock');
    if(priorFocus&&typeof priorFocus.focus==='function')priorFocus.focus();
  }
  function open(link){
    const raw=link.dataset.popupQr||new URL(link.href,location.href).searchParams.get('id')||'';
    const id=String(raw).trim();if(!id)return;
    priorFocus=document.activeElement;
    const card=link.closest('[data-card-id]');
    const label=card?.querySelector('.chariot-list-id')?.textContent?.trim()||id;
    title.textContent='Fiche chariot — '+label;
    const target=new URL(link.href,location.href);target.searchParams.set('popup','1');
    frame.src=target.href;
    modal.classList.add('open');modal.setAttribute('aria-hidden','false');
    document.documentElement.classList.add('mobile-fiche-popup-lock');
    closeBtn.focus({preventScroll:true});
  }
  list.addEventListener('click',function(e){
    const link=e.target.closest('.mobile-fiche-popup-link');
    if(!link||!isMobile())return;
    e.preventDefault();e.stopPropagation();
    if(typeof e.stopImmediatePropagation==='function')e.stopImmediatePropagation();
    open(link);
  },true);
  closeBtn.addEventListener('click',close);
  modal.addEventListener('click',e=>{if(e.target===modal)close()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open')){e.preventDefault();close()}});
})();
</script>
<script src="js/button-icons.js?v=67.42"></script><script src="js/search-suggestions.js?v=67.42"></script><script src="js/mobile-fiche-popup.js?v=67.43"></script></body></html>
