<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081f33"><link rel="stylesheet" href="style.css?v=69.0"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>SBI — Chariots prévus pour livraison</title><style>
.pl-filter-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.pl-search{grid-column:1/-1}.pl-reset{min-height:44px}.pl-list{display:grid;gap:10px;margin-top:14px}.pl-item{display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer;transition:box-shadow .15s ease,transform .15s ease}.pl-item:focus-visible{outline:3px solid rgba(20,120,230,.28);outline-offset:2px}.pl-item:hover{box-shadow:0 7px 18px rgba(15,35,55,.08);transform:translateY(-1px)}.pl-item-main{min-width:0}.pl-item-title{font-size:18px;font-weight:800;color:var(--text,#0b315d)} .pl-item-title .pl-chariot-link{display:block;width:100%;padding:3px 0}.pl-item-meta{margin-top:4px;color:var(--muted,#62748a);font-size:14px}.pl-item-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pl-item-actions .btn{white-space:nowrap}.pl-plan-disabled{background:#e5e7eb!important;border-color:#d1d5db!important;color:#6b7280!important;box-shadow:none!important;cursor:not-allowed!important;opacity:1!important}@media(max-width:900px){.pl-filter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.pl-item{flex-direction:column;align-items:stretch}.pl-item-actions{justify-content:stretch}.pl-item-actions .btn{flex:1}}@media(max-width:560px){.pl-filter-grid{grid-template-columns:1fr}.pl-search{grid-column:auto}.pl-item-title{font-size:17px}}

/* V67.41 — Fiche chariot en popup fiable */
.fiche-popup{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(7,20,35,.58);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:5000}
.fiche-popup.open{display:flex}
.fiche-popup-dialog{position:relative;width:min(1180px,96vw);height:min(900px,94vh);background:#fff;border-radius:18px;box-shadow:0 24px 80px rgba(0,0,0,.3);overflow:hidden;display:flex;flex-direction:column}
.fiche-popup-head{height:52px;min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px;border-bottom:1px solid #dbe5ee;background:#f8fbfe}
.fiche-popup-title{font-size:16px;font-weight:800;color:#163a60;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fiche-popup-close{width:38px;height:38px;border:0;border-radius:10px;background:#eaf1f7;color:#163a60;font-size:24px;line-height:1;cursor:pointer;display:grid;place-items:center}
.fiche-popup-close:hover{background:#dce8f2}
.fiche-popup-frame{width:100%;height:100%;border:0;background:#f4f8fc}
html.fiche-popup-lock,html.fiche-popup-lock body{overflow:hidden!important}
@media(max-width:700px){.fiche-popup{padding:0}.fiche-popup-dialog{width:100vw;height:100vh;max-height:none;border-radius:0}.fiche-popup-head{height:50px;min-height:50px;padding:0 10px}.fiche-popup-title{font-size:14px}.fiche-popup-close{width:36px;height:36px}}
</style></head><body><div id="licenseGate" class="license-gate"><div class="license-inner"><img src="assets/logo-sbi-hangcha.png"><div class="license-loader"></div><h2>Vérification de la licence...</h2><div id="licenseInfo" class="license-info">Vérification en cours...</div></div></div><header class="top"><button class="menu-btn mobile-only" onclick="toggleMenu()">☰</button><div class="brand">SBI</div><div class="avatar">H</div></header><div class="layout"><aside class="side desktop" data-nav></aside><main class="content"><div class="page-head"><div><h1 class="page-title">Chariots prévus pour livraison</h1><div class="sub">Chariots réservés, en préparation ou prêts à être livrés</div></div></div><div class="card"><div class="pl-filter-grid"><input id="plSearch" class="search pl-search" placeholder="Rechercher châssis, moteur, client..." autocomplete="off"><select id="plStatus" class="search"><option value="">Statut : Tous</option></select><select id="plEngine" class="search"><option value="">Moteur : Tous</option></select><select id="plCapacity" class="search"><option value="">Capacité : Toutes</option></select><select id="plMast" class="search"><option value="">Mât : Tous</option></select><select id="plHeight" class="search"><option value="">Hauteur : Toutes</option></select><button id="plReset" class="btn light pl-reset" type="button">Réinitialiser</button></div><div id="plCount" class="sub" style="margin-top:10px"></div></div><div id="plList" class="pl-list"></div></main></div><div class="overlay"><aside class="side" data-nav></aside></div><div id="fichePopup" class="fiche-popup" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Fiche chariot">
  <div class="fiche-popup-dialog" role="document">
    <div class="fiche-popup-head">
      <div id="fichePopupTitle" class="fiche-popup-title">Fiche chariot</div>
      <button id="fichePopupClose" class="fiche-popup-close" type="button" aria-label="Fermer">×</button>
    </div>
    <iframe id="fichePopupFrame" class="fiche-popup-frame" title="Fiche chariot" loading="eager"></iframe>
  </div>
</div>
<footer>QR ID permanent • Données techniques et modifications stockées dans Supabase<br>© 2026 · Developed by <strong>BaCkDoooR</strong></footer><script src="js/shell.js?v=69.0"></script><script src="maintenance-config.js?v=7"></script><script src="js/app.js?v=69.0"></script><script>
async function plannedDeliveryPage(){
  if(!await session())return; await loadChariots();
  try{await loadDeliveryPlans({migrateLocal:true})}catch(e){DELIVERY_PLANS=readCachedDeliveryPlans(); console.warn('Chargement des planifications depuis le serveur impossible',e)}
  const els={search:document.getElementById('plSearch'),status:document.getElementById('plStatus'),engine:document.getElementById('plEngine'),capacity:document.getElementById('plCapacity'),mast:document.getElementById('plMast'),height:document.getElementById('plHeight'),reset:document.getElementById('plReset'),count:document.getElementById('plCount'),list:document.getElementById('plList')};
  // Voir la fiche ouvre la fiche du chariot dans un popup.
  let baseRows=CHARIOTS.filter(isPlanned);
  function latestFirst(rows){return [...rows].sort((a,b)=>{const da=new Date(a.created_at||a.updated_at||0).getTime(),db=new Date(b.created_at||b.updated_at||0).getTime();if(db!==da)return db-da;return(Number(b.id)||0)-(Number(a.id)||0)})}
  function values(key,label){const vals=[...new Set(baseRows.map(c=>String(c[key]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));return '<option value="">'+label+'</option>'+vals.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('')}
  function buildFilters(){els.status.innerHTML='<option value="">Statut : Tous</option>'+[...new Set(baseRows.map(c=>String(c.status||'').trim()).filter(Boolean))].sort().map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');els.engine.innerHTML=values('engine','Moteur : Tous');els.capacity.innerHTML=values('capacity','Capacité : Toutes');els.mast.innerHTML=values('mast_type','Mât : Tous');els.height.innerHTML=values('lifting_height','Hauteur : Toutes')}
  function match(c){const q=els.search.value.trim().toLowerCase();const text=[c.qr_id,c.chassis,c.engine,c.engine_number,c.client].map(v=>String(v||'').toLowerCase());return(!q||text.some(v=>v.includes(q)))&&(!els.status.value||String(c.status||'')===els.status.value)&&(!els.engine.value||String(c.engine||'')===els.engine.value)&&(!els.capacity.value||String(c.capacity||'')===els.capacity.value)&&(!els.mast.value||String(c.mast_type||'')===els.mast.value)&&(!els.height.value||String(c.lifting_height||'')===els.height.value)}
  function render(){const rows=latestFirst(baseRows.filter(match));els.count.textContent=rows.length+' chariot'+(rows.length!==1?'s':'')+' prévu'+(rows.length!==1?'s':'')+' pour livraison';els.list.innerHTML=rows.map(c=>{const alreadyPlanned=!!getDeliveryPlan(c.qr_id);return `<div class="card pl-item" role="link" tabindex="0" aria-label="Ouvrir la fiche du chariot ${esc(c.chassis||c.qr_id||'')}" data-chariot-row="${esc(c.qr_id||'')}"><div class="pl-item-main"><div class="pl-item-title">${esc(c.chassis||c.qr_id||'—')}</div><div class="pl-item-meta">${esc(c.engine||'—')} · ${esc(fmtCapacity(c.capacity)||'—')} · ${esc(c.client||'—')}</div><div class="pl-item-meta">Statut : <strong>${esc(c.status||'—')}</strong>${c.delivery_date?' · Livraison : '+esc(c.delivery_date):''}</div></div><div class="pl-item-actions"><a class="btn light pl-view-link" href="chariot.html?id=${encodeURIComponent(c.qr_id||'')}&from=prevus">Voir la fiche</a>${isAdmin()?(alreadyPlanned?`<button class="btn pl-plan-disabled" type="button" disabled aria-disabled="true" title="Ce chariot est déjà planifié.">Planifié</button>`:`<button class="btn" type="button" data-plan="${esc(c.qr_id)}">Planifier</button>`):''}${isAdmin()?(()=>{const st=normalizeStatus(c.status);if(st==='reserve')return `<button class="btn" type="button" data-workflow="start-modification" data-qr="${esc(c.qr_id)}">Modification production</button>`;if(st==='modification production')return `<button class="btn" type="button" data-workflow="finish-modification" data-qr="${esc(c.qr_id)}">Modification terminée</button>`;if(st==='preparation livraison')return `<button class="btn" type="button" data-workflow="ready" data-qr="${esc(c.qr_id)}">Prêt à livrer</button>`;if(st==='pret a livrer')return `<button class="btn delivered-action" type="button" data-workflow="deliver" data-qr="${esc(c.qr_id)}">Livrer</button>`;return ''})():''}</div></div>`}).join('')||'<div class="empty">Aucun chariot prévu pour livraison.</div>';els.list.querySelectorAll('[data-plan]').forEach(b=>b.onclick=e=>{e.stopPropagation();if(!requireAdmin())return;location.href='planning-livraisons.html?qr='+encodeURIComponent(b.dataset.plan)});els.list.querySelectorAll('[data-workflow]').forEach(b=>b.onclick=async e=>{e.stopPropagation();if(!requireAdmin())return;if(b.dataset.busy==='1')return;b.dataset.busy='1';b.disabled=true;try{const ok=await performWorkflowAction(b.dataset.qr,b.dataset.workflow);if(ok){await loadChariots();await loadDeliveryPlans({migrateLocal:false}).catch(()=>{});baseRows=CHARIOTS.filter(isPlanned);buildFilters();render();toastCardUpdate(b.dataset.qr,b.dataset.workflow==='start-modification'?'Modification production':b.dataset.workflow==='finish-modification'?'Préparation livraison':b.dataset.workflow==='prepare'?'Préparation livraison':b.dataset.workflow==='ready'?'Prêt à livrer':'Livré')}}finally{b.dataset.busy='0';b.disabled=false}});els.list.querySelectorAll('[data-chariot-row]').forEach(row=>{const go=()=>{const id=row.dataset.chariotRow;if(id)location.href='chariot.html?id='+encodeURIComponent(id)+'&from=prevus'};row.addEventListener('click',e=>{if(e.target.closest('a,button,input,select,textarea'))return;go()});row.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('a,button,input,select,textarea')){e.preventDefault();go()}})})}
  const fichePopup=document.getElementById('fichePopup');
  const fichePopupFrame=document.getElementById('fichePopupFrame');
  const fichePopupTitle=document.getElementById('fichePopupTitle');
  const fichePopupClose=document.getElementById('fichePopupClose');
  let fichePopupPreviousFocus=null;
  function openFichePopup(qrId,label){
    const id=String(qrId||'').trim();
    if(!id||!fichePopup||!fichePopupFrame)return;
    fichePopupPreviousFocus=document.activeElement;
    fichePopupTitle.textContent=label?('Fiche chariot — '+label):'Fiche chariot';
    fichePopupFrame.src='chariot.html?id='+encodeURIComponent(id)+'&from=prevus&popup=1';
    fichePopup.classList.add('open');
    fichePopup.setAttribute('aria-hidden','false');
    document.documentElement.classList.add('fiche-popup-lock');
    fichePopupClose&&fichePopupClose.focus();
  }
  function closeFichePopup(){
    if(!fichePopup)return;
    fichePopup.classList.remove('open');
    fichePopup.setAttribute('aria-hidden','true');
    if(fichePopupFrame)fichePopupFrame.src='about:blank';
    document.documentElement.classList.remove('fiche-popup-lock');
    if(fichePopupPreviousFocus&&typeof fichePopupPreviousFocus.focus==='function')fichePopupPreviousFocus.focus();
  }
  fichePopupClose&&fichePopupClose.addEventListener('click',closeFichePopup);
  fichePopup&&fichePopup.addEventListener('click',e=>{if(e.target===fichePopup)closeFichePopup()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&fichePopup&&fichePopup.classList.contains('open')){e.preventDefault();closeFichePopup()}});
  els.list.addEventListener('click',e=>{
    const link=e.target.closest('.pl-view-link');
    if(!link)return;
    e.preventDefault();
    e.stopPropagation();
    const row=link.closest('[data-chariot-row]');
    const id=row&&row.dataset.chariotRow;
    const label=row&&row.querySelector('.pl-item-title')?.textContent?.trim();
    openFichePopup(id,label);
  });

  function isPlanned(c){const s=normalizeStatus(c.status);return s==='prevu pour livraison'||s==='reserve'||s==='modification production'||s==='preparation livraison'||s==='pret a livrer'}
  buildFilters();[els.search,els.status,els.engine,els.capacity,els.mast,els.height].forEach(el=>el.addEventListener(el===els.search?'input':'change',render));els.reset.onclick=()=>{[els.search,els.status,els.engine,els.capacity,els.mast,els.height].forEach(el=>el.value='');render()};render();
  const refreshLive=async()=>{try{await loadChariots();await loadDeliveryPlans();baseRows=CHARIOTS.filter(isPlanned);buildFilters();render()}catch(e){console.warn('Actualisation temps réel livraisons prévues',e)}};
  startSbiRealtime(()=>{if(document.visibilityState==='visible')refreshLive()},['chariots','maintenance']);
  window.addEventListener('pageshow',async()=>{await refreshLive()});
}
initPage(plannedDeliveryPage())
</script><script src="js/button-icons.js?v=67.41"></script><script src="js/search-suggestions.js?v=67.41"></script><script src="js/mobile-fiche-popup.js?v=69.0"></script></body></html>
