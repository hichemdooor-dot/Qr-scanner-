<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css?v=66.5"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>SBI — Chariots prévus pour livraison</title><style>
.pl-filter-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.pl-search{grid-column:1/-1}.pl-reset{min-height:44px}.pl-list{display:grid;gap:10px;margin-top:14px}.pl-item{display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer;transition:box-shadow .15s ease,transform .15s ease}.pl-item:focus-visible{outline:3px solid rgba(20,120,230,.28);outline-offset:2px}.pl-item:hover{box-shadow:0 7px 18px rgba(15,35,55,.08);transform:translateY(-1px)}.pl-item-main{min-width:0}.pl-item-title{font-size:18px;font-weight:800;color:var(--text,#0b315d)} .pl-item-title .pl-chariot-link{display:block;width:100%;padding:3px 0}.pl-item-meta{margin-top:4px;color:var(--muted,#62748a);font-size:14px}.pl-item-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pl-item-actions .btn{white-space:nowrap}.pl-plan-disabled{background:#e5e7eb!important;border-color:#d1d5db!important;color:#6b7280!important;box-shadow:none!important;cursor:not-allowed!important;opacity:1!important}@media(max-width:900px){.pl-filter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.pl-item{flex-direction:column;align-items:stretch}.pl-item-actions{justify-content:stretch}.pl-item-actions .btn{flex:1}}@media(max-width:560px){.pl-filter-grid{grid-template-columns:1fr}.pl-search{grid-column:auto}.pl-item-title{font-size:17px}}
</style></head><body><div id="licenseGate" class="license-gate"><div class="license-inner"><img src="assets/logo-sbi-hangcha.png"><div class="license-loader"></div><h2>Vérification de la licence...</h2><div id="licenseInfo" class="license-info">Vérification en cours...</div></div></div><header class="top"><button class="menu-btn mobile-only" onclick="toggleMenu()">☰</button><div class="brand">SBI</div><div class="avatar">H</div></header><div class="layout"><aside class="side desktop" data-nav></aside><main class="content"><div class="page-head"><div><h1 class="page-title">Chariots prévus pour livraison</h1><div class="sub">Chariots réservés, en préparation ou prêts à être livrés</div></div></div><div class="card"><div class="pl-filter-grid"><input id="plSearch" class="search pl-search" placeholder="Rechercher châssis, moteur, client..." autocomplete="off"><select id="plStatus" class="search"><option value="">Statut : Tous</option></select><select id="plEngine" class="search"><option value="">Moteur : Tous</option></select><select id="plCapacity" class="search"><option value="">Capacité : Toutes</option></select><select id="plMast" class="search"><option value="">Mât : Tous</option></select><select id="plHeight" class="search"><option value="">Hauteur : Toutes</option></select><button id="plReset" class="btn light pl-reset" type="button">Réinitialiser</button></div><div id="plCount" class="sub" style="margin-top:10px"></div></div><div id="plList" class="pl-list"></div></main></div><div class="overlay"><aside class="side" data-nav></aside></div><footer>QR ID permanent • Données techniques et modifications stockées dans Supabase<br>© 2026 · Developed by <strong>BaCkDoooR</strong></footer><script src="js/shell.js?v=66.5"></script><script src="maintenance-config.js?v=7"></script><script src="js/app.js?v=66.5"></script><script>
async function plannedDeliveryPage(){
  if(!await session())return; await loadChariots();
  try{await loadDeliveryPlans({migrateLocal:true})}catch(e){DELIVERY_PLANS=readCachedDeliveryPlans(); console.warn('Chargement des planifications depuis le serveur impossible',e)}
  const els={search:document.getElementById('plSearch'),status:document.getElementById('plStatus'),engine:document.getElementById('plEngine'),capacity:document.getElementById('plCapacity'),mast:document.getElementById('plMast'),height:document.getElementById('plHeight'),reset:document.getElementById('plReset'),count:document.getElementById('plCount'),list:document.getElementById('plList')};
  let baseRows=CHARIOTS.filter(isPlanned);
  function latestFirst(rows){return [...rows].sort((a,b)=>{const da=new Date(a.created_at||a.updated_at||0).getTime(),db=new Date(b.created_at||b.updated_at||0).getTime();if(db!==da)return db-da;return(Number(b.id)||0)-(Number(a.id)||0)})}
  function values(key,label){const vals=[...new Set(baseRows.map(c=>String(c[key]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));return '<option value="">'+label+'</option>'+vals.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('')}
  function buildFilters(){els.status.innerHTML='<option value="">Statut : Tous</option>'+[...new Set(baseRows.map(c=>String(c.status||'').trim()).filter(Boolean))].sort().map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');els.engine.innerHTML=values('engine','Moteur : Tous');els.capacity.innerHTML=values('capacity','Capacité : Toutes');els.mast.innerHTML=values('mast_type','Mât : Tous');els.height.innerHTML=values('lifting_height','Hauteur : Toutes')}
  function match(c){const q=els.search.value.trim().toLowerCase();const text=[c.qr_id,c.chassis,c.engine,c.engine_number,c.client].map(v=>String(v||'').toLowerCase());return(!q||text.some(v=>v.includes(q)))&&(!els.status.value||String(c.status||'')===els.status.value)&&(!els.engine.value||String(c.engine||'')===els.engine.value)&&(!els.capacity.value||String(c.capacity||'')===els.capacity.value)&&(!els.mast.value||String(c.mast_type||'')===els.mast.value)&&(!els.height.value||String(c.lifting_height||'')===els.height.value)}
  function render(){const rows=latestFirst(baseRows.filter(match));els.count.textContent=rows.length+' chariot'+(rows.length!==1?'s':'')+' prévu'+(rows.length!==1?'s':'')+' pour livraison';els.list.innerHTML=rows.map(c=>{const alreadyPlanned=!!getDeliveryPlan(c.qr_id);return `<div class="card pl-item" role="link" tabindex="0" aria-label="Ouvrir la fiche du chariot ${esc(c.chassis||c.qr_id||'')}" data-chariot-row="${esc(c.qr_id||'')}"><div class="pl-item-main"><div class="pl-item-title">${esc(c.chassis||c.qr_id||'—')}</div><div class="pl-item-meta">${esc(c.engine||'—')} · ${esc(fmtCapacity(c.capacity)||'—')} · ${esc(c.client||'—')}</div><div class="pl-item-meta">Statut : <strong>${esc(c.status||'—')}</strong>${c.delivery_date?' · Livraison : '+esc(c.delivery_date):''}</div></div><div class="pl-item-actions"><a class="btn light pl-view-link" href="chariot.html?id=${encodeURIComponent(c.qr_id||'')}">Voir la fiche</a>${alreadyPlanned?`<button class="btn pl-plan-disabled" type="button" disabled aria-disabled="true" title="Ce chariot est déjà planifié.">Planifié</button>`:`<button class="btn" type="button" data-plan="${esc(c.qr_id)}">Planifier</button>`}${(()=>{const st=normalizeStatus(c.status);if(st==='reserve'&&alreadyPlanned)return `<button class="btn" type="button" data-workflow="prepare" data-qr="${esc(c.qr_id)}">Préparation</button>`;if(st==='preparation livraison')return `<button class="btn" type="button" data-workflow="ready" data-qr="${esc(c.qr_id)}">Prêt à livrer</button>`;if(st==='pret a livrer'&&isAdmin())return `<button class="btn delivered-action" type="button" data-workflow="deliver" data-qr="${esc(c.qr_id)}">Livrer</button>`;return ''})()}</div></div>`}).join('')||'<div class="empty">Aucun chariot prévu pour livraison.</div>';els.list.querySelectorAll('[data-plan]').forEach(b=>b.onclick=e=>{e.stopPropagation();location.href='planning-livraisons.html?qr='+encodeURIComponent(b.dataset.plan)});els.list.querySelectorAll('[data-workflow]').forEach(b=>b.onclick=async e=>{e.stopPropagation();if(b.dataset.busy==='1')return;b.dataset.busy='1';b.disabled=true;try{const ok=await performWorkflowAction(b.dataset.qr,b.dataset.workflow);if(ok){await loadChariots();await loadDeliveryPlans({migrateLocal:false}).catch(()=>{});baseRows=CHARIOTS.filter(isPlanned);buildFilters();render();toastCardUpdate(b.dataset.qr,b.dataset.workflow==='prepare'?'Préparation livraison':b.dataset.workflow==='ready'?'Prêt à livrer':'Livré')}}finally{b.dataset.busy='0';b.disabled=false}});els.list.querySelectorAll('[data-chariot-row]').forEach(row=>{const go=()=>{const id=row.dataset.chariotRow;if(id)location.href='chariot.html?id='+encodeURIComponent(id)};row.addEventListener('click',e=>{if(e.target.closest('a,button,input,select,textarea'))return;go()});row.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('a,button,input,select,textarea')){e.preventDefault();go()}})});}
  function isPlanned(c){const s=normalizeStatus(c.status);return s==='prevu pour livraison'||s==='reserve'||s==='preparation livraison'||s==='pret a livrer'}
  buildFilters();[els.search,els.status,els.engine,els.capacity,els.mast,els.height].forEach(el=>el.addEventListener(el===els.search?'input':'change',render));els.reset.onclick=()=>{[els.search,els.status,els.engine,els.capacity,els.mast,els.height].forEach(el=>el.value='');render()};render();
  const refreshLive=async()=>{try{await loadChariots();await loadDeliveryPlans();baseRows=CHARIOTS.filter(isPlanned);buildFilters();render()}catch(e){console.warn('Actualisation temps réel livraisons prévues',e)}};
  startSbiRealtime(()=>{if(document.visibilityState==='visible')refreshLive()},['chariots','maintenance']);
  window.addEventListener('pageshow',async()=>{await refreshLive()});
}
initPage(plannedDeliveryPage())
</script></body></html>
