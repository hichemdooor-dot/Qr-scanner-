<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css?v=63.2"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>SBI — Chariots prévus pour livraison</title><style>
.pl-filter-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.pl-search{grid-column:1/-1}.pl-reset{min-height:44px}.pl-list{display:grid;gap:10px;margin-top:14px}.pl-item{display:flex;align-items:center;justify-content:space-between;gap:16px}.pl-item-main{min-width:0}.pl-item-title{font-size:18px;font-weight:800;color:var(--text,#0b315d)}.pl-item-meta{margin-top:4px;color:var(--muted,#62748a);font-size:14px}.pl-item-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pl-item-actions .btn{white-space:nowrap}@media(max-width:900px){.pl-filter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.pl-item{flex-direction:column;align-items:stretch}.pl-item-actions{justify-content:stretch}.pl-item-actions .btn{flex:1}}@media(max-width:560px){.pl-filter-grid{grid-template-columns:1fr}.pl-search{grid-column:auto}.pl-item-title{font-size:17px}}
</style></head><body><div id="licenseGate" class="license-gate"><div class="license-inner"><img src="assets/logo-sbi-hangcha.png"><div class="license-loader"></div><h2>Vérification de la licence...</h2><div id="licenseInfo" class="license-info">Vérification en cours...</div></div></div><header class="top"><button class="menu-btn mobile-only" onclick="toggleMenu()">☰</button><div class="brand">SBI</div><div class="avatar">H</div></header><div class="layout"><aside class="side desktop" data-nav></aside><main class="content"><div class="page-head"><div><h1 class="page-title">Chariots prévus pour livraison</h1><div class="sub">Chariots réservés, en préparation ou prêts à être livrés</div></div></div><div class="card"><div class="pl-filter-grid"><input id="plSearch" class="search pl-search" placeholder="Rechercher châssis, moteur, client..." autocomplete="off"><select id="plStatus" class="search"><option value="">Statut : Tous</option></select><select id="plEngine" class="search"><option value="">Moteur : Tous</option></select><select id="plCapacity" class="search"><option value="">Capacité : Toutes</option></select><select id="plMast" class="search"><option value="">Mât : Tous</option></select><select id="plHeight" class="search"><option value="">Hauteur : Toutes</option></select><button id="plReset" class="btn light pl-reset" type="button">Réinitialiser</button></div><div id="plCount" class="sub" style="margin-top:10px"></div></div><div id="plList" class="pl-list"></div></main></div><div class="overlay"><aside class="side" data-nav></aside></div><footer>QR ID permanent • Données techniques et modifications stockées dans Supabase<br>© 2026 · Developed by <strong>BaCkDoooR</strong></footer><script src="js/shell.js?v=35"></script><script src="maintenance-config.js?v=5"></script><script src="js/app.js?v=63.3"></script><script>
async function plannedDeliveryPage(){
  if(!await session())return; await loadChariots();
  const els={search:document.getElementById('plSearch'),status:document.getElementById('plStatus'),engine:document.getElementById('plEngine'),capacity:document.getElementById('plCapacity'),mast:document.getElementById('plMast'),height:document.getElementById('plHeight'),reset:document.getElementById('plReset'),count:document.getElementById('plCount'),list:document.getElementById('plList')};
  let baseRows=CHARIOTS.filter(isPlanned);
  function latestFirst(rows){return [...rows].sort((a,b)=>{const da=new Date(a.created_at||a.updated_at||0).getTime(),db=new Date(b.created_at||b.updated_at||0).getTime();if(db!==da)return db-da;return(Number(b.id)||0)-(Number(a.id)||0)})}
  function values(key,label){const vals=[...new Set(baseRows.map(c=>String(c[key]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));return '<option value="">'+label+'</option>'+vals.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('')}
  function buildFilters(){els.status.innerHTML='<option value="">Statut : Tous</option>'+[...new Set(baseRows.map(c=>String(c.status||'').trim()).filter(Boolean))].sort().map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');els.engine.innerHTML=values('engine','Moteur : Tous');els.capacity.innerHTML=values('capacity','Capacité : Toutes');els.mast.innerHTML=values('mast_type','Mât : Tous');els.height.innerHTML=values('lifting_height','Hauteur : Toutes')}
  function match(c){const q=els.search.value.trim().toLowerCase();const text=[c.qr_id,c.chassis,c.engine,c.engine_number,c.client].map(v=>String(v||'').toLowerCase());return(!q||text.some(v=>v.includes(q)))&&(!els.status.value||String(c.status||'')===els.status.value)&&(!els.engine.value||String(c.engine||'')===els.engine.value)&&(!els.capacity.value||String(c.capacity||'')===els.capacity.value)&&(!els.mast.value||String(c.mast_type||'')===els.mast.value)&&(!els.height.value||String(c.lifting_height||'')===els.height.value)}
  function render(){const rows=latestFirst(baseRows.filter(match));els.count.textContent=rows.length+' chariot'+(rows.length!==1?'s':'')+' prévu'+(rows.length!==1?'s':'')+' pour livraison';els.list.innerHTML=rows.map(c=>`<div class="card pl-item"><div class="pl-item-main"><div class="pl-item-title">${esc(c.chassis||c.qr_id||'—')}</div><div class="pl-item-meta">${esc(c.engine||'—')} · ${esc(fmtCapacity(c.capacity)||'—')} · ${esc(c.client||'—')}</div><div class="pl-item-meta">Statut : <strong>${esc(c.status||'—')}</strong>${c.delivery_date?' · Livraison : '+esc(c.delivery_date):''}</div></div><div class="pl-item-actions"><button class="btn light" type="button" data-view="${esc(c.qr_id)}">Voir la fiche</button><button class="btn" type="button" data-plan="${esc(c.qr_id)}">Planifier</button></div></div>`).join('')||'<div class="empty">Aucun chariot prévu pour livraison.</div>';els.list.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>location.href='chariot.html?id='+encodeURIComponent(b.dataset.view));els.list.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>location.href='planning-livraisons.html?qr='+encodeURIComponent(b.dataset.plan))}
  function isPlanned(c){const s=normalizeStatus(c.status);return s==='prevu pour livraison'||s==='reserve'||s==='preparation livraison'||s==='pret a livrer'}
  buildFilters();[els.search,els.status,els.engine,els.capacity,els.mast,els.height].forEach(el=>el.addEventListener(el===els.search?'input':'change',render));els.reset.onclick=()=>{[els.search,els.status,els.engine,els.capacity,els.mast,els.height].forEach(el=>el.value='');render()};render();
}
initPage(plannedDeliveryPage())
</script></body></html>
