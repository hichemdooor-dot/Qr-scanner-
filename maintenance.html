<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<link rel="stylesheet" href="css/style.css?v=63.2">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="maintenance-config.js?v=2"></script>
<title>SBI — Maintenance</title>
<style>
.maintenance-page{
  min-height:100vh;display:grid;place-items:center;padding:24px;
  background:
    radial-gradient(circle at 15% 20%, rgba(23,139,231,.12), transparent 32%),
    radial-gradient(circle at 85% 80%, rgba(8,72,120,.10), transparent 30%),
    linear-gradient(160deg,#eaf4fb,#f8fbfe 55%,#eef6fb);
}
.maintenance-wrap{width:min(760px,96vw)}
.maintenance-card{
  background:#fff;border:1px solid var(--line);border-radius:18px;
  box-shadow:0 18px 55px rgba(23,56,88,.16);padding:36px;
  text-align:center;
}
.maintenance-logo{width:min(300px,72vw);max-height:125px;object-fit:contain;margin:0 auto 18px}
.maintenance-icon{
  width:86px;height:86px;border-radius:50%;display:grid;place-items:center;
  margin:0 auto 18px;background:#edf6fe;border:1px solid #cfe7fb;
  font-size:42px;color:#087bf0;
}
.maintenance-title{margin:0;color:#123f66;font-size:32px;line-height:1.15}
.maintenance-message{max-width:600px;margin:12px auto 0;color:#668099;font-size:16px;line-height:1.6}
.maintenance-loader{
  width:52px;height:52px;border:6px solid #e4f0fa;border-top-color:#087bf0;
  border-radius:50%;animation:spin .9s linear infinite;margin:25px auto 17px;
}
.maintenance-return{
  display:none;margin:0 auto 18px;padding:12px 15px;border-radius:10px;
  background:#f6f9fc;border:1px solid var(--line);color:#234866;font-size:13px;
}
.maintenance-refresh{min-width:170px}
.maintenance-admin{
  margin-top:24px;padding-top:22px;border-top:1px solid #e7edf3;text-align:left;
}
.maintenance-admin h2{margin:0 0 5px;font-size:16px;color:#173f63}
.maintenance-admin .sub{margin-bottom:12px}
.maintenance-admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.maintenance-admin-grid label{display:block;font-size:12px;font-weight:800;color:#31516d;margin-bottom:5px}
.maintenance-admin-grid input{width:100%;height:44px;padding:0 11px;border:1px solid #cbd8e5;border-radius:8px}
.maintenance-admin-actions{display:flex;gap:9px;margin-top:10px}
.maintenance-admin-actions .btn{flex:1}
.maintenance-error{min-height:18px;margin-top:8px}
.maintenance-note{margin-top:15px;font-size:11px;color:#8ba0b2}
@media(max-width:650px){
  .maintenance-card{padding:24px 16px;border-radius:14px}
  .maintenance-title{font-size:25px}
  .maintenance-message{font-size:14px}
  .maintenance-admin-grid{grid-template-columns:1fr}
  .maintenance-admin-actions{flex-direction:column}
}
</style>
</head>
<body class="maintenance-page">
<main class="maintenance-wrap">
  <section class="maintenance-card">
    <img class="maintenance-logo" src="assets/logo-sbi-hangcha.png" alt="SBI HANGCHA">
    <div class="maintenance-icon" aria-hidden="true">⚙</div>
    <h1 class="maintenance-title" id="maintenanceTitle">Site en maintenance</h1>
    <p class="maintenance-message" id="maintenanceMessage">Notre site est momentanément indisponible pendant une opération de maintenance.</p>
    <div class="maintenance-return" id="maintenanceReturn"></div>
    <div class="maintenance-loader" aria-hidden="true"></div>
    <button class="btn maintenance-refresh" type="button" onclick="location.reload()">Actualiser la page</button>

    <div class="maintenance-admin">
      <h2>Accès administrateur</h2>
      <div class="sub">L'administrateur peut se connecter ici pour accéder au site pendant la maintenance.</div>
      <div class="maintenance-admin-grid">
        <div>
          <label for="maintenanceEmail">Email</label>
          <input id="maintenanceEmail" type="email" autocomplete="username" placeholder="Email administrateur">
        </div>
        <div>
          <label for="maintenancePassword">Mot de passe</label>
          <input id="maintenancePassword" type="password" autocomplete="current-password" placeholder="Mot de passe">
        </div>
      </div>
      <div class="maintenance-admin-actions">
        <button class="btn" type="button" onclick="maintenanceLogin()">Connexion administrateur</button>
      </div>
      <div id="maintenanceError" class="error maintenance-error"></div>
      <div class="maintenance-note">Les utilisateurs standards restent sur cette page jusqu'à la fin de la maintenance.</div>
    </div>
  </section>
</main>

<script src="js/app.js?v=60"></script>
<script>
(function(){
  const cfg=window.SBI_MAINTENANCE||{};
  if(cfg.title) document.getElementById('maintenanceTitle').textContent=cfg.title;
  if(cfg.message) document.getElementById('maintenanceMessage').textContent=cfg.message;
  if(cfg.expectedReturn){
    const el=document.getElementById('maintenanceReturn');
    el.style.display='block';
    el.textContent='Retour prévu : '+cfg.expectedReturn;
  }
  document.getElementById('maintenancePassword')?.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();maintenanceLogin();}
  });
})();
async function maintenanceLogin(){
  const email=document.getElementById('maintenanceEmail')?.value.trim();
  const password=document.getElementById('maintenancePassword')?.value||'';
  const msg=document.getElementById('maintenanceError');
  if(!email||!password){if(msg)msg.textContent='Email et mot de passe requis.';return}
  if(msg)msg.textContent='Connexion...';
  try{
    const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
    if(error)throw error;
    const {data:s,error:se}=await supabaseClient.rpc('get_my_sbi_status');
    if(se)throw se;
    if(s?.disabled){await supabaseClient.auth.signOut();throw new Error('Accès bloqué : votre compte est désactivé.')}
    const role=String(s?.role||data?.user?.user_metadata?.sbi_role||'').toLowerCase();
    const isAdminUser=role==='admin'||String(email).toLowerCase()===ADMIN_EMAIL.toLowerCase();
    if(!isAdminUser){await supabaseClient.auth.signOut();throw new Error('Accès administrateur requis.')}
    location.href='dashboard.html';
  }catch(e){
    if(msg)msg.textContent=friendlySupabaseError(e);
  }
}
</script>
</body>
</html>
