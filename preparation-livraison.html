<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css?v=67.00"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>SBI — Préparation livraison</title><style>
.prep-filter-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.prep-search{grid-column:1/-1}.prep-reset{min-height:44px}.prep-list{display:grid;gap:10px;margin-top:14px}.prep-item{display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer;transition:box-shadow .15s ease,transform .15s ease}.prep-item:focus-visible{outline:3px solid rgba(20,120,230,.28);outline-offset:2px}.prep-item:hover{box-shadow:0 7px 18px rgba(15,35,55,.08);transform:translateY(-1px)}.prep-item-main{min-width:0}.prep-item-title{font-size:18px;font-weight:800;color:var(--text,#0b315d)} .prep-item-title .prep-chariot-link{display:block;width:100%;padding:3px 0}.prep-item-meta{margin-top:4px;color:var(--muted,#62748a);font-size:14px}.prep-item-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.prep-item-actions .btn{white-space:nowrap}@media(max-width:900px){.prep-filter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.prep-search{grid-column:1/-1}.prep-item{flex-direction:column;align-items:stretch}.prep-item-actions{justify-content:stretch}.prep-item-actions .btn{flex:1}}@media(max-width:560px){.prep-filter-grid{grid-template-columns:1fr}.prep-search{grid-column:auto}.prep-item-title{font-size:17px}}
</style></head><body><div id="licenseGate" class="license-gate"><div class="license-inner"><img src="assets/logo-sbi-hangcha.png"><div class="license-loader"></div><h2>Vérification de la licence...</h2><div id="licenseInfo" class="license-info">Vérification en cours...</div></div></div><header class="top"><button class="menu-btn mobile-only" onclick="toggleMenu()">☰</button><div class="brand">SBI</div><div class="avatar">H</div></header><div class="layout"><aside class="side desktop" data-nav></aside><main class="content"><div class="page-head"><div><h1 class="page-title">Préparation livraison</h1><div class="sub">Chariots terminés en production et transférés pour préparation</div></div></div><div class="card prep-filter-card">
  <div class="prep-filter-grid">
    <input id="prepSearch" class="search prep-search" placeholder="Rechercher châssis, moteur, client..." autocomplete="off">
    <select id="prepStatus" class="search"><option value="">Statut : Tous</option></select>
    <select id="prepEngine" class="search"><option value="">Moteur : Tous</option></select>
    <select id="prepCapacity" class="search"><option value="">Capacité : Toutes</option></select>
    <select id="prepMast" class="search"><option value="">Mât : Tous</option></select>
    <select id="prepHeight" class="search"><option value="">Hauteur : Toutes</option></select>
    <button id="prepReset" class="btn light prep-reset" type="button">Réinitialiser</button>
  </div>
  <div id="prepCount" class="sub" style="margin-top:10px"></div>
</div>
<div id="prepList" class="prep-list"></div></main></div><div class="overlay"><aside class="side" data-nav></aside></div><footer>QR ID permanent • Données techniques et modifications stockées dans Supabase<br>© 2026 · Developed by <strong>BaCkDoooR</strong></footer><script src="js/shell.js?v=67.00"></script><script src="maintenance-config.js?v=7"></script><script src="js/app.js?v=67.00"></script><script>
async function preparationLivraisonPage(){
  if(!await session())return;
  await loadChariots();
  const els={search:document.getElementById('prepSearch'),status:document.getElementById('prepStatus'),engine:document.getElementById('prepEngine'),capacity:document.getElementById('prepCapacity'),mast:document.getElementById('prepMast'),height:document.getElementById('prepHeight'),reset:document.getElementById('prepReset'),count:document.getElementById('prepCount'),list:document.getElementById('prepList')};
  let baseRows=[];
  function latestFirst(rows){return [...rows].sort((a,b)=>{const da=new Date(a.created_at||a.updated_at||0).getTime();const db=new Date(b.created_at||b.updated_at||0).getTime();if(db!==da)return db-da;return (Number(b.id)||0)-(Number(a.id)||0)})}
  function values(key,label){const vals=[...new Set(baseRows.map(c=>String(c[key]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));return '<option value="">'+label+'</option>'+vals.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('')}
  function buildFilters(){
    els.status.innerHTML='<option value="">Statut : Tous</option>'+[...new Set(baseRows.map(c=>String(c.status||'').trim()).filter(Boolean))].sort().map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');
    els.engine.innerHTML=values('engine','Moteur : Tous');
    els.capacity.innerHTML=values('capacity','Capacité : Toutes');
    els.mast.innerHTML=values('mast_type','Mât : Tous');
    els.height.innerHTML=values('lifting_height','Hauteur : Toutes');
  }
  function match(c){
    const q=els.search.value.trim().toLowerCase();
    const text=[c.qr_id,c.chassis,c.engine,c.client].map(v=>String(v||'').toLowerCase());
    return (!q||text.some(v=>v.includes(q)))
      &&(!els.status.value||String(c.status||'')===els.status.value)
      &&(!els.engine.value||String(c.engine||'')===els.engine.value)
      &&(!els.capacity.value||String(c.capacity||'')===els.capacity.value)
      &&(!els.mast.value||String(c.mast_type||'')===els.mast.value)
      &&(!els.height.value||String(c.lifting_height||'')===els.height.value);
  }
  function render(){
    const rows=latestFirst(baseRows.filter(match));
    els.count.textContent=rows.length+' chariot'+(rows.length!==1?'s':'');
    els.list.innerHTML=rows.map(c=>{
      const admin=isAdmin();
      return `<div class="card prep-item" role="link" tabindex="0" aria-label="Ouvrir la fiche du chariot ${esc(c.chassis||c.qr_id||'')}" data-chariot-row="${esc(c.qr_id||'')}">
        <div class="prep-item-main">
          <div class="prep-item-title">${esc(c.chassis||c.qr_id||'—')}</div>
          <div class="prep-item-meta">${esc(c.engine||'—')} · ${esc(fmtCapacity(c.capacity)||'—')} · ${esc(c.client||'—')}</div>
          <div class="prep-item-meta">Statut : <strong>${esc(c.status||'—')}</strong></div>
        </div>
        <div class="prep-item-actions">
          <a class="btn light prep-view-link" href="chariot.html?id=${encodeURIComponent(c.qr_id||'')}&from=preparation">Voir la fiche</a>
          ${admin?`<button class="btn save-ready" type="button" data-prep-ready="${esc(c.qr_id)}">Prêt à livrer</button>`:''}
        </div>
      </div>`
    }).join('')||'<div class="empty">Aucun chariot correspondant.</div>';
    els.list.querySelectorAll('[data-prep-ready]').forEach(b=>b.onclick=e=>{e.stopPropagation();passToPreparation(b.dataset.prepReady)});els.list.querySelectorAll('[data-chariot-row]').forEach(row=>{const go=()=>{const id=row.dataset.chariotRow;if(id)location.href='chariot.html?id='+encodeURIComponent(id)+'&from=preparation'};row.addEventListener('click',e=>{if(e.target.closest('a,button,input,select,textarea'))return;go()});row.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('a,button,input,select,textarea')){e.preventDefault();go()}})});
  }
  async function passToPreparation(qrId){
    if(!requireAdmin())return;
    const ok=await performWorkflowAction(qrId,'ready');
    if(!ok)return;
    await loadChariots();
    baseRows=CHARIOTS.filter(c=>normalizeStatus(c.status)==='preparation livraison');
    buildFilters();render();toastCardUpdate(qrId,'Prêt à livrer');
  }
  // La page affiche uniquement les chariots déjà transférés en préparation livraison.
  baseRows=CHARIOTS.filter(c=>normalizeStatus(c.status)==='preparation livraison');
  buildFilters();
  [els.search,els.status,els.engine,els.capacity,els.mast,els.height].forEach(el=>el.addEventListener(el===els.search?'input':'change',render));
  els.reset.onclick=()=>{[els.search,els.status,els.engine,els.capacity,els.mast,els.height].forEach(el=>el.value='');render()};
  render();
  startSbiRealtime(async()=>{if(document.visibilityState!=='visible')return;try{await loadChariots();baseRows=CHARIOTS.filter(c=>normalizeStatus(c.status)==='preparation livraison');buildFilters();render()}catch(e){console.warn('Actualisation temps réel préparation',e)}} ,['chariots','maintenance']);
  window.addEventListener('pageshow',async()=>{try{await loadChariots();baseRows=CHARIOTS.filter(c=>normalizeStatus(c.status)==='preparation livraison');buildFilters();render()}catch(e){}});
}
initPage(preparationLivraisonPage())
</script></body></html>
