<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css?v=63.2"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>SBI — Préparation livraison</title><style>
.prep-filter-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.prep-search{grid-column:1/-1}.prep-reset{min-height:44px}.prep-list{display:grid;gap:10px;margin-top:14px}.prep-item{display:flex;align-items:center;justify-content:space-between;gap:16px}.prep-item-main{min-width:0}.prep-item-title{font-size:18px;font-weight:800;color:var(--text,#0b315d)}.prep-item-meta{margin-top:4px;color:var(--muted,#62748a);font-size:14px}.prep-item-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.prep-item-actions .btn{white-space:nowrap}@media(max-width:900px){.prep-filter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.prep-search{grid-column:1/-1}.prep-item{flex-direction:column;align-items:stretch}.prep-item-actions{justify-content:stretch}.prep-item-actions .btn{flex:1}}@media(max-width:560px){.prep-filter-grid{grid-template-columns:1fr}.prep-search{grid-column:auto}.prep-item-title{font-size:17px}}
</style></head><body><div id="licenseGate" class="license-gate"><div class="license-inner"><img src="assets/logo-sbi-hangcha.png"><div class="license-loader"></div><h2>Vérification de la licence...</h2><div id="licenseInfo" class="license-info">Vérification en cours...</div></div></div><header class="top"><button class="menu-btn mobile-only" onclick="toggleMenu()">☰</button><div class="brand">SBI</div><div class="avatar">H</div></header><div class="layout"><aside class="side desktop" data-nav></aside><main class="content"><div class="page-head"><div><h1 class="page-title">Préparation livraison</h1><div class="sub">Préparer un chariot avant sa livraison</div></div></div><div class="card prep-filter-card">
  <div class="prep-filter-grid">
    <input id="prepSearch" class="search prep-search" placeholder="Rechercher châssis, moteur, client..." autocomplete="off">
    <select id="prepStatus" class="search"><option value="">Statut : Tous</option></select>
    <select id="prepEngine" class="search"><option value="">Moteur : Tous</option></select>
    <select id="prepCapacity" class="search"><option value="">Capacité : Toutes</option></select>
    <select id="prepMast" class="search"><option value="">Mât : Tous</option></select>
    <select id="prepHeight" class="search"><option value="">Hauteur : Toutes</option></select>
    <button id="prepReset" class="btn light prep-reset" type="button">Réinitialiser</button>
  </div>
  <div id="prepCount" class="sub" style="margin-top:10px"></div>
</div>
<div id="prepList" class="prep-list"></div></main></div><div class="overlay"><aside class="side" data-nav></aside></div><footer>QR ID permanent • Données techniques et modifications stockées dans Supabase<br>© 2026 · Developed by <strong>BaCkDoooR</strong></footer><script src="js/shell.js?v=35"></script><script src="maintenance-config.js?v=5"></script><script src="js/app.js?v=63.3"></script><script>
async function preparationLivraisonPage(){
  if(!await session())return;
  await loadChariots();
  const els={search:document.getElementById('prepSearch'),status:document.getElementById('prepStatus'),engine:document.getElementById('prepEngine'),capacity:document.getElementById('prepCapacity'),mast:document.getElementById('prepMast'),height:document.getElementById('prepHeight'),reset:document.getElementById('prepReset'),count:document.getElementById('prepCount'),list:document.getElementById('prepList')};
  let baseRows=[];
  function latestFirst(rows){return [...rows].sort((a,b)=>{const da=new Date(a.created_at||a.updated_at||0).getTime();const db=new Date(b.created_at||b.updated_at||0).getTime();if(db!==da)return db-da;return (Number(b.id)||0)-(Number(a.id)||0)})}
  function values(key,label){const vals=[...new Set(baseRows.map(c=>String(c[key]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));return '<option value="">'+label+'</option>'+vals.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('')}
  function buildFilters(){
    els.status.innerHTML='<option value="">Statut : Tous</option>'+[...new Set(baseRows.map(c=>String(c.status||'').trim()).filter(Boolean))].sort().map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');
    els.engine.innerHTML=values('engine','Moteur : Tous');
    els.capacity.innerHTML=values('capacity','Capacité : Toutes');
    els.mast.innerHTML=values('mast_type','Mât : Tous');
    els.height.innerHTML=values('lifting_height','Hauteur : Toutes');
  }
  function match(c){
    const q=els.search.value.trim().toLowerCase();
    const text=[c.qr_id,c.chassis,c.engine,c.client].map(v=>String(v||'').toLowerCase());
    return (!q||text.some(v=>v.includes(q)))
      &&(!els.status.value||String(c.status||'')===els.status.value)
      &&(!els.engine.value||String(c.engine||'')===els.engine.value)
      &&(!els.capacity.value||String(c.capacity||'')===els.capacity.value)
      &&(!els.mast.value||String(c.mast_type||'')===els.mast.value)
      &&(!els.height.value||String(c.lifting_height||'')===els.height.value);
  }
  function render(){
    const rows=latestFirst(baseRows.filter(match));
    els.count.textContent=rows.length+' chariot'+(rows.length!==1?'s':'');
    els.list.innerHTML=rows.map(c=>{
      const disabled=normalizeStatus(c.status)==='préparation livraison';
      return `<div class="card prep-item">
        <div class="prep-item-main">
          <div class="prep-item-title">${esc(c.chassis||c.qr_id||'—')}</div>
          <div class="prep-item-meta">${esc(c.engine||'—')} · ${esc(fmtCapacity(c.capacity)||'—')} · ${esc(c.client||'—')}</div>
          <div class="prep-item-meta">Statut : <strong>${esc(c.status||'—')}</strong></div>
        </div>
        <div class="prep-item-actions">
          <button class="btn light" type="button" data-view="${esc(c.qr_id)}">Voir la fiche</button>
          <button class="btn" type="button" data-prep="${esc(c.qr_id)}" ${disabled?'disabled':''}>${disabled?'Déjà en préparation':'Passer en préparation'}</button>
        </div>
      </div>`
    }).join('')||'<div class="empty">Aucun chariot correspondant.</div>';
    els.list.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>location.href='chariot.html?id='+encodeURIComponent(b.dataset.view));
    els.list.querySelectorAll('[data-prep]').forEach(b=>b.onclick=()=>passToPreparation(b.dataset.prep));
  }
  async function passToPreparation(qrId){
    if(!currentUser){alert('Connexion requise.');return}
    const c=CHARIOTS.find(x=>String(x.qr_id)===String(qrId));if(!c)return;
    if(normalizeStatus(c.status)==='préparation livraison')return;
    if(!confirm('Passer le chariot '+(c.chassis||c.qr_id)+' en « Préparation livraison » ?'))return;
    const now=new Date().toISOString();
    const {error}=await supabaseClient.from('chariots').update({status:'Préparation livraison',updated_at:now}).eq('qr_id',qrId);
    if(error){alert('Erreur : '+error.message);return}
    try{await supabaseClient.from('maintenance').insert({qr_id:qrId,date:now.slice(0,10),technicien:currentUser.email,type:'Statut',travaux:'Statut : '+(c.status||'—')+' → Préparation livraison',created_by:currentUser.id})}catch(e){}
    alert('Chariot passé en préparation livraison. La page va être actualisée.');
    // Recharger la page pour repartir de Supabase et retirer immédiatement
    // le chariot de la liste des chariots disponibles pour préparation.
    window.location.reload();
  }
  baseRows=CHARIOTS.filter(c=>{const st=normalizeStatus(c.status);return st!=='livré' && st!=='préparation livraison';});
  buildFilters();
  [els.search,els.status,els.engine,els.capacity,els.mast,els.height].forEach(el=>el.addEventListener(el===els.search?'input':'change',render));
  els.reset.onclick=()=>{[els.search,els.status,els.engine,els.capacity,els.mast,els.height].forEach(el=>el.value='');render()};
  render();
}
initPage(preparationLivraisonPage())
</script></body></html>
